[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pytRIBS"
authors = [{name = "L. Wren Raming", email = "lraming@asu.edu"},
    {name = "C. Josh Cederstrom", email = "cjceders@asu.edu"},
        {name = "Akram Hossain", email = "mhossa46@asu.edu"},
        {name = "Jose Becerra", email = "jabecer3@asu.edu"},
    {name = "Enrique R. Vivoni", email = "evivoni@asu.edu"}]
description = "A pre-to-post processing python package for the distributed hydrological model tRIBS"
readme = "README.md"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
keywords = ["hydrology", "modeling", "tRIBS", "watershed", "distributed hydrology", "TIN"]
dependencies = [
    "docker>=7.1.0",
    "earthaccess>=0.14.0",
    "geopandas>=1.0.0",
    "matplotlib-scalebar>=0.9.0",
    "matplotlib>=3.9.0",
    "numpy>=2.1.0",
    "OWSLib>=0.31.0",
    "pandas>=2.2.3",
    "pyproj>=3.7.1",
    "PyWavelets>=1.8.0",
    "rasterio>=1.4.0",
    "requests>=2.32.3",
    "rosetta-soil>=0.3,<0.4",
    "scikit-learn>=1.7.0",
    "scipy>=1.14.0",
    "shapely>=2.0.7",
    "timezonefinder>=6.5.9",
    "triangle>=20250106",
    "whitebox>=2.3.6",
    "xarray>=2025.4.0",
    "h5py>=3.15.1",
    "h5netcdf>=1.3.0",
    "rioxarray>=0.17.0",
]
version = "1.0.0"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Topic :: Scientific/Engineering :: GIS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/tRIBS-Model/pytRIBS"
Documentation = "https://pytribs.readthedocs.io/en/latest/"
Repository = "https://github.com/tRIBS-Model/pytRIBS"
Changelog = "https://github.com/tRIBS-Model/pytRIBS/blob/main/CHANGELOG.md"
Issues = "https://github.com/tRIBS-Model/pytRIBS/issues"
Examples = "https://github.com/tRIBS-Model/pytRIBS-examples"

[tool.setuptools.packages.find]
include = ["pytRIBS*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Network canaries are excluded by default; run them with `pytest -m network`
addopts = "-m 'not network'"
markers = [
    "network: tests that hit live external services (ISRIC, SOLUS, POLARIS, NASA Giovanni)",
]