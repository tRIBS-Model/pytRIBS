name: publish

# Publishes pytRIBS to PyPI when a version tag is pushed.
#
# Authentication uses PyPI Trusted Publishing (OIDC): there is no API token
# stored in this repository. The trusted publisher is registered on PyPI under
# Manage -> Publishing with:
#   owner:       tRIBS-Model
#   repository:  pytRIBS
#   workflow:    publish.yml
#   environment: pypi
#
# To cut a release: bump `version` in pyproject.toml, merge to main, then
#   git tag v1.0.0 && git push origin v1.0.0
# The build job refuses to continue if the tag and pyproject version disagree.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify tag matches the version in pyproject.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          proj_version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$tag_version pyproject=$proj_version"
          if [ "$tag_version" != "$proj_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject version $proj_version"
            exit 1
          fi

      - name: Check distribution metadata
        run: twine check --strict dist/*

      - name: Install the built wheel and smoke test import
        run: |
          python -m venv /tmp/checkenv
          /tmp/checkenv/bin/pip install --upgrade pip
          /tmp/checkenv/bin/pip install dist/*.whl
          /tmp/checkenv/bin/python -c "from pytRIBS.classes import Project, Model, Results, Soil, Land, Met, Mesh; print('public API imports from the built wheel')"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    environment:
      name: pypi
      url: https://pypi.org/p/pytRIBS

    permissions:
      id-token: write  # required for Trusted Publishing

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
